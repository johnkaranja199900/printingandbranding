<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Print & Publish Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-mark">P</div>
        <h2>Admin Portal</h2>
        <p>Secure management dashboard for staff and administrators</p>
      </div>
      <form>
        <div class="form-group">
          <label>Email / Username</label>
          <input type="text" placeholder="admin@printpublish.co.ke" />
        </div>
        <div class="form-group" style="margin-top: 16px;">
          <label>Password</label>
          <input type="password" placeholder="••••••••" />
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin: 16px 0 24px;">
          <label style="display:flex; align-items:center; gap:8px; font-weight:600;"><input type="checkbox" /> Remember Me</label>
          <a href="#" style="font-weight:700; color: var(--primary);">Forgot Password?</a>
        </div>
        <a href="admin-dashboard.html" class="btn btn-primary btn-full">Login</a>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
