<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="brand"><div class="logo-mark">P</div><div class="brand-copy"><strong>Print & Publish</strong><small>Admin</small></div></div>
        <div class="nav-group"><div class="nav-title">Main</div><a href="admin-dashboard.html">Dashboard</a><a href="admin-orders.html">Orders</a><a href="admin-quotations.html">Quotations</a><a href="admin-sales.html">Sales</a><a href="admin-inventory.html">Inventory</a><a href="admin-publishing.html">Publishing</a><a href="admin-portfolio.html">Portfolio</a><a href="admin-notifications.html">Notifications</a><a href="admin-reports.html" class="active">Reports</a><a href="admin-staff.html">Users & Staff</a></div>

      <main class="admin-main">
        <div class="topbar-admin"><div><h2 style="margin:0;">Reports</h2></div><button class="btn btn-primary">Generate Report</button></div>
        <div class="form-card">
          <div class="section-header"><div class="eyebrow">Filters</div><h2>Reporting period</h2></div>
          <div class="form-grid">
            <div class="form-group"><label>Report Category</label><select><option>Sales Reports</option><option>Orders Reports</option><option>Inventory Reports</option><option>Book Reports</option></select></div>
            <div class="form-group"><label>Start Date</label><input type="date" /></div>
            <div class="form-group"><label>End Date</label><input type="date" /></div>
            <div class="form-group full"><button class="btn btn-primary">Generate Report</button> <button class="btn btn-light">Print</button> <button class="btn btn-light">Export PDF</button> <button class="btn btn-light">Export Excel</button></div>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
